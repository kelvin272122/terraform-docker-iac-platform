<a class="skip-link" href="#main-content">Saltar al contenido</a>

<mat-sidenav-container class="app-shell">
  <mat-sidenav
    id="app-sidenav"
    class="app-sidenav"
    [mode]="isDesktop() ? 'side' : 'over'"
    [opened]="isDesktop() || mobileMenuOpen()"
    (closedStart)="closeMobileMenu()"
    aria-label="Navegación principal"
  >
    <div class="brand">
      <img class="brand__logo" src="logo.svg" alt="" width="32" height="32" />
      <span class="brand__name">Panel de verificación IaC</span>
    </div>

    <mat-nav-list aria-label="Secciones del panel">
      <a
        mat-list-item
        routerLink="/estado"
        routerLinkActive="active-link"
        #estadoLink="routerLinkActive"
        [attr.aria-current]="estadoLink.isActive ? 'page' : null"
      >
        <span matListItemTitle>Estado</span>
      </a>
      <a
        mat-list-item
        routerLink="/registros"
        routerLinkActive="active-link"
        #registrosLink="routerLinkActive"
        [attr.aria-current]="registrosLink.isActive ? 'page' : null"
      >
        <span matListItemTitle>Registros</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="app-sidenav-content">
    <mat-toolbar class="app-toolbar">
      @if (!isDesktop()) {
        <button
          mat-icon-button
          type="button"
          class="app-toolbar__menu"
          aria-label="Abrir navegación"
          aria-controls="app-sidenav"
          [attr.aria-expanded]="mobileMenuOpen()"
          (click)="toggleMobileMenu()"
        >
          <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z" />
          </svg>
        </button>
      }
      <span class="app-toolbar__title">Panel de verificación IaC</span>
    </mat-toolbar>

    <main id="main-content" class="app-content" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
