<h2 mat-dialog-title>Eliminar registro</h2>
<mat-dialog-content>
  <p>
    ¿Eliminar «{{ data.title }}»? Esta acción no se puede deshacer.
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button type="button" class="confirm-delete" (click)="confirm()">
    Eliminar
  </button>
</mat-dialog-actions>
