resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  location = /api-docs {
    return 404;
  }

  location = /api {
    include /etc/nginx/api-proxy.conf;
  }

  location ^~ /api/ {
    include /etc/nginx/api-proxy.conf;
  }

  location ~* \.(?:js|css|svg|ico|woff2?)$ {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location @api_bad_gateway {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 502 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"La API no está disponible."}}';
  }

  location @api_timeout {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 504 '{"error":{"code":"UPSTREAM_TIMEOUT","message":"La API no respondió a tiempo."}}';
  }

  location @api_payload_too_large {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"El cuerpo de la solicitud supera el límite permitido."}}';
  }
}
